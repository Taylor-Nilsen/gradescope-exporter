name: Publish to Chrome Web Store

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.github/**']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Store rejects uploads that don't raise the version, so append the run number.
      # ponytail: assumes manifest version has at most 3 parts (store max is 4)
      - name: Build zip
        run: |
          v="$(jq -r .version manifest.json).${{ github.run_number }}"
          jq --arg v "$v" '.version = $v' manifest.json > m.json && mv m.json manifest.json
          zip -r ext.zip manifest.json background.js export.html export.js icons
          echo "Version $v"

      # Mint the token straight from the SA key; avoids needing the IAM Credentials API.
      - name: Get access token
        id: auth
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          pip install -q google-auth requests
          t=$(python3 -c '
          import json, os, sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          k = json.loads(os.environ["KEY"])
          print("Service account:", k["client_email"], file=sys.stderr)
          c = service_account.Credentials.from_service_account_info(k, scopes=["https://www.googleapis.com/auth/chromewebstore"])
          c.refresh(Request()); print(c.token)')
          echo "::add-mask::$t"
          echo "access_token=$t" >> "$GITHUB_OUTPUT"

      - name: Upload and publish
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          ITEM: publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
        run: |
          r=$(curl -sS -X POST -H "Authorization: Bearer $TOKEN" -T ext.zip \
            "https://chromewebstore.googleapis.com/upload/v2/$ITEM:upload")
          echo "$r"
          echo "$r" | grep -qE 'SUCCEEDED|IN_PROGRESS'
          r=$(curl -sS -X POST -H "Authorization: Bearer $TOKEN" \
            "https://chromewebstore.googleapis.com/v2/$ITEM:publish")
          echo "$r"
          ! echo "$r" | grep -q '"error"'

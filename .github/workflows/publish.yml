name: Publish to Chrome Web Store

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.github/**']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Store rejects uploads that don't raise the version, so append the run number.
      # ponytail: assumes manifest version has at most 3 parts (store max is 4)
      - name: Build zip
        run: |
          v="$(jq -r .version manifest.json).${{ github.run_number }}"
          jq --arg v "$v" '.version = $v' manifest.json > m.json && mv m.json manifest.json
          zip -r ext.zip manifest.json background.js export.html export.js icons
          echo "Version $v"

      - uses: google-github-actions/auth@v2
        id: auth
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and publish
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          ITEM: publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
        run: |
          r=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -T ext.zip \
            "https://chromewebstore.googleapis.com/upload/v2/$ITEM:upload")
          echo "$r"
          echo "$r" | grep -qE 'SUCCEEDED|IN_PROGRESS'
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" \
            "https://chromewebstore.googleapis.com/v2/$ITEM:publish"

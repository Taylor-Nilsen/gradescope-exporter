<!doctype html>
<meta charset="utf-8">
<title>Gradescope Exporter</title>
<link rel="icon" href="icons/icon48.png">
<style>
  :root { color-scheme:light dark; --bg:#f7f6f2; --panel:#fdfcfa; --field:#fff; --blue:#bfdcf2; --blue-dark:#8fc0e4; --ink:#2b2f33; --muted:#6b7177; --line:#e2dfd8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1d20; --panel:#232629; --field:#1b1d20; --blue:#2f5877; --blue-dark:#4a83b0; --ink:#e4e6e8; --muted:#9ba2a9; --line:#363a3f; }
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif }
  main { max-width:560px; margin:56px auto; padding:0 20px }
  header { display:flex; align-items:center; gap:12px; margin-bottom:6px }
  header img { width:32px; height:32px }
  h1 { font-size:20px; font-weight:600; margin:0; letter-spacing:-.01em }
  #ctx { color:var(--muted); margin:0 0 28px; font-size:14px }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px 18px; margin-bottom:14px }
  section h2 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px }
  h2.head { display:flex; justify-content:space-between; align-items:center }
  h2.head label { padding:0; gap:8px }
  label { display:flex; align-items:center; gap:10px; padding:5px 0; cursor:pointer }
  label:has(input:disabled) { color:var(--muted); cursor:default }
  input[type=radio], input[type=checkbox] { width:16px; height:16px; margin:0; accent-color:var(--blue-dark) }
  button { font:inherit; font-weight:600; color:var(--ink); background:var(--blue); border:1px solid var(--blue-dark); border-radius:6px; padding:10px 22px; cursor:pointer; margin-top:6px }
  button:hover:not(:disabled) { background:var(--blue-dark) }
  button:disabled { opacity:.5; cursor:default }
  .actions { display:flex; align-items:center; gap:12px; margin-top:6px; min-height:44px }
  .actions button { margin:0 }
  progress { flex:1; height:10px; appearance:none; border:1px solid var(--blue-dark); border-radius:6px; background:var(--panel); overflow:hidden }
  progress::-webkit-progress-bar { background:var(--panel) }
  progress::-webkit-progress-value { background:var(--blue-dark); transition:width .2s }
  progress:indeterminate { background:linear-gradient(90deg, var(--panel) 0 30%, var(--blue) 50%, var(--panel) 70%) 0 0 / 300% 100%; animation:slide 1.2s linear infinite }
  progress:indeterminate::-webkit-progress-bar { background:transparent }
  @keyframes slide { to { background-position:-150% 0 } }
  #pct { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap }
  [hidden] { display:none !important }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-top:20px; font:13px/1.6 ui-monospace, Menlo, monospace; white-space:pre-wrap; max-height:50vh; overflow:auto; color:var(--muted) }
  pre:empty { display:none }
  .course { display:grid; grid-template-columns:1fr auto; align-items:center; border-top:1px solid var(--line); padding:4px 0 }
  .course:first-child { border-top:0 }
  .course .term, .course .prof { color:var(--muted); font-size:13px }
  .course .prof:empty::before { content:'add prof'; opacity:.6 }
  .editable { cursor:text }
  .edit { font:inherit; font-size:13px; color:var(--ink); padding:1px 6px; border:1px solid var(--blue-dark); border-radius:4px; background:var(--field); outline:none }
  .toggle { background:none; border:0; padding:4px 8px; margin:0; color:var(--muted); font-size:14px; cursor:pointer }
  .subs { grid-column:1 / -1; padding:2px 0 6px 26px; font-size:14px }
  .subs:empty { display:none }
  .subs label { padding:3px 0 }
</style>
<main>
  <header><img src="icons/icon48.png" alt=""><h1>Gradescope Exporter</h1></header>
  <p id="ctx">Reading page…</p>
  <section><h2 class="head">Courses <label><input type="checkbox" id="all"> Select all</label></h2><div id="courses"></div></section>
  <section><h2>Files</h2>
    <label><input type="checkbox" id="orig" checked> Original (what you submitted)</label>
    <label><input type="checkbox" id="graded" checked> Graded copy (with annotations, where graded)</label>
  </section>
  <div class="actions"><button id="go">Export to ZIP</button><progress id="bar" hidden></progress><span id="pct" hidden></span></div>
  <pre id="log"></pre>
  <datalist id="terms"></datalist>
  <datalist id="profs"></datalist>
</main>
<script src="export.js"></script>

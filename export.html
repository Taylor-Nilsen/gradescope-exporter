<!doctype html>
<meta charset="utf-8">
<title>Gradescope Exporter</title>
<link rel="icon" href="icons/icon48.png">
<style>
  :root { --bg:#f7f6f2; --panel:#fdfcfa; --blue:#bfdcf2; --blue-dark:#8fc0e4; --ink:#2b2f33; --muted:#6b7177; --line:#e2dfd8; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif }
  main { max-width:560px; margin:56px auto; padding:0 20px }
  header { display:flex; align-items:center; gap:12px; margin-bottom:6px }
  header img { width:32px; height:32px }
  h1 { font-size:20px; font-weight:600; margin:0; letter-spacing:-.01em }
  #ctx { color:var(--muted); margin:0 0 28px; font-size:14px }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px 18px; margin-bottom:14px }
  section h2 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px }
  label { display:flex; align-items:center; gap:10px; padding:5px 0; cursor:pointer }
  label:has(input:disabled) { color:var(--muted); cursor:default }
  input[type=radio], input[type=checkbox] { width:16px; height:16px; margin:0; accent-color:var(--blue-dark) }
  button { font:inherit; font-weight:600; color:var(--ink); background:var(--blue); border:1px solid var(--blue-dark); border-radius:6px; padding:10px 22px; cursor:pointer; margin-top:6px }
  button:hover:not(:disabled) { background:var(--blue-dark) }
  button:disabled { opacity:.5; cursor:default }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-top:20px; font:13px/1.6 ui-monospace, Menlo, monospace; white-space:pre-wrap; max-height:50vh; overflow:auto; color:var(--muted) }
  pre:empty { display:none }
</style>
<main>
  <header><img src="icons/icon48.png" alt=""><h1>Gradescope Exporter</h1></header>
  <p id="ctx">Reading page…</p>
  <section><h2>Scope</h2>
    <label><input type="radio" name="scope" value="assignment" id="scopeA"> This assignment only</label>
    <label><input type="radio" name="scope" value="course" checked> Whole course</label>
  </section>
  <section><h2>Files</h2>
    <label><input type="checkbox" id="orig" checked> Original (what you submitted)</label>
    <label><input type="checkbox" id="graded" checked> Graded copy (with annotations, where graded)</label>
  </section>
  <button id="go">Export to ZIP</button>
  <pre id="log"></pre>
</main>
<script src="export.js"></script>
